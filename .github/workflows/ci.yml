name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # TODO: add `npm run format:check` once the one-time `npm run format` PR lands
      # (held back so it does not conflict with open PRs).
      - run: npm run typecheck
      - run: npm test
      - name: Build (throwaway key, never a real secret)
        run: |
          export ENCRYPTION_KEY="$(openssl rand -base64 32)"
          npm run build
