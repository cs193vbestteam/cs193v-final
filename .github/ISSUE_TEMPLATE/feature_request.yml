name: Feature or task
description: New functionality, an improvement, or a work item
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible afterwards, and why?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Concrete acceptance criteria, including the tests that should exist.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Design ideas, open questions, related issues.
