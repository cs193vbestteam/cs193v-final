name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a plan...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Assistant (private chat),
          Coordination (mediator / negotiation),
          Frontend,
          Backend (auth / database / encryption),
          Infra (CI / deploy),
          Not sure,
        ]
  - type: textarea
    id: notes
    attributes:
      label: Logs, screenshots, notes
      description: Never paste real API keys, passwords or other people's data.
